<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Magnus TV · Painel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#16181c; --muted:#6b7078; --line:#e6e2d9;
    --accent:#c98d1e; --accent-ink:#fff; --danger:#c2412d; --ok:#2f7d4f; --soft:#f1ede4;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1114; --card:#171a1f; --ink:#f1efe9; --muted:#9aa0a8; --line:#262a31;
      --accent:#e8b04b; --accent-ink:#16181c; --soft:#1e2228; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 120px}
  header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 20px}
  h1{font-size:22px;margin:0;letter-spacing:-.01em}
  h1 b{color:var(--accent)}
  .who{font-size:13px;color:var(--muted)}
  .who button{margin-left:6px}
  section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  section h2{font-size:15px;margin:0 0 12px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);font-weight:600}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=email],input[type=number],input[type=url],textarea,select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  textarea{min-height:90px;resize:vertical}
  button,.btn{appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:10px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button.ghost{background:transparent}
  button.small{padding:6px 10px;font-size:13px}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1}
  .adds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(max-width:560px){.adds{grid-template-columns:repeat(2,1fr)}}
  .item{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg)}
  .item.off{opacity:.5}
  .thumb{width:72px;height:72px;border-radius:8px;background:var(--soft);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px}
  .thumb video,.thumb img{width:100%;height:100%;object-fit:cover}
  .body{flex:1;min-width:0}
  .body .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .body .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .body .ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
  .empty{color:var(--muted);text-align:center;padding:20px}
  .savebar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}
  .savebar .in{max-width:760px;width:100%;display:flex;align-items:center;gap:12px}
  .savebar .msg{flex:1;font-size:14px;color:var(--muted)}
  .savebar button{min-width:150px}
  dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(520px,calc(100% - 32px));padding:20px}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog h3{margin:0 0 6px}
  dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .progress{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:10px;display:none}
  .progress div{height:100%;width:0;background:var(--accent);transition:width .2s}
  .login{max-width:400px;margin:12vh auto 0;text-align:center}
  .login p{color:var(--muted)}
  .hint{font-size:13px;color:var(--muted);margin-top:6px}
  .switch{display:flex;align-items:center;gap:10px;margin-top:12px}

  /* ---- Apresentações / controle ao vivo ---- */
  .live{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
  .live h2{color:var(--accent)}
  .live h2::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#e5484d;margin-right:8px;vertical-align:1px;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.3}}
  .stage{display:grid;grid-template-columns:2fr 1fr;gap:10px;align-items:end}
  .stage figure{margin:0}
  .stage img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:10px;display:block}
  .stage figcaption{font-size:12px;color:var(--muted);margin-top:4px}
  .pad{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .pad button{padding:22px 10px;font-size:22px;border-radius:14px}
  .pad .next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .deck{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--bg)}
  .deck img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#000;flex:none}
  .deck .body{flex:1;min-width:0}
  .deck .ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .strip{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
  .strip img{height:52px;aspect-ratio:16/9;object-fit:cover;border-radius:5px;cursor:pointer;opacity:.55;border:2px solid transparent}
  .strip .vid{position:relative;display:inline-block;flex:none}
  .strip .vid::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:16px;text-shadow:0 1px 4px #000;pointer-events:none}
  .vlist{margin-top:10px}
  .vlist .row{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
  .vlist .row span{flex:1}
  .strip img.cur{opacity:1;border-color:var(--accent)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="vLogin" class="login hidden">
    <h1>Magnus <b>TV</b></h1>
    <p>Entre com seu e-mail. Você vai receber um link de acesso, sem senha.</p>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
    <div style="margin-top:10px"><button class="primary" id="btnLogin" style="width:100%">Enviar link de acesso</button></div>
    <p id="loginMsg" class="hint"></p>
  </div>

  <!-- PAINEL -->
  <div id="vApp" class="hidden">
    <header>
      <h1>Magnus <b>TV</b></h1>
      <div class="who"><span id="whoEmail"></span><button class="small ghost" id="btnSair">Sair</button></div>
    </header>


    <section id="secLive" class="live hidden">
      <h2>Ao vivo na TV</h2>
      <div style="font-weight:600;margin-bottom:8px" id="liveTitle"></div>
      <div class="stage">
        <figure><img id="liveNow" alt=""><figcaption id="liveCount"></figcaption></figure>
        <figure><img id="liveNext" alt=""><figcaption>Próximo</figcaption></figure>
      </div>
      <div class="pad"><button id="btnPrev">◀ Voltar</button><button id="btnNext" class="next">Avançar ▶</button></div>
      <button id="btnPlay" class="hidden" style="width:100%;margin-top:10px;padding:16px;font-size:18px">⏸ Pausar vídeo</button>
      <div class="strip" id="liveStrip"></div>
      <div style="margin-top:12px"><button id="btnMural" class="ghost" style="width:100%">⏹ Encerrar e voltar ao mural</button></div>
    </section>

    <section>
      <h2>Apresentações</h2>
      <div id="decks"></div>
      <button id="btnPdf" style="width:100%">＋ Subir apresentação (PDF)</button>
      <p class="hint">Exporte do PowerPoint, Keynote, Canva ou Google Slides como <b>PDF</b>. Cada página vira um slide na TV.</p>
      <div class="progress" id="pdfProg"><div></div></div>
      <p class="hint" id="pdfMsg"></p>
    </section>

    <section>
      <h2>Mural (quando não tem apresentação)</h2>
      <div id="lista"></div>
      <div class="adds">
        <button id="addVideo">＋ Vídeo</button>
        <button id="addInsta">＋ Instagram</button>
        <button id="addRecado">＋ Recado</button>
        <button id="addImagem">＋ Imagem</button>
      </div>
    </section>

    <section>
      <h2>Barra de baixo</h2>
      <div class="switch"><input type="checkbox" id="mostrarBarra"><label for="mostrarBarra" style="margin:0;color:var(--ink)">Mostrar barra com relógio, clima e recados</label></div>
      <label for="recados">Recados que correm na barra (um por linha)</label>
      <textarea id="recados" placeholder="Bem-vindo à Magnus&#10;Siga @magnus no Instagram"></textarea>
      <label for="cidade">Cidade do clima</label>
      <div class="row"><input type="text" id="cidade" placeholder="Ex.: São Ludgero"><button id="btnCidade" style="flex:none">Buscar</button></div>
      <p class="hint" id="cidadeMsg"></p>
    </section>

    <section>
      <h2>Marca</h2>
      <label for="marca">Nome exibido</label>
      <input type="text" id="marca" placeholder="MAGNUS">
      <label>Logo (PNG com fundo transparente, opcional)</label>
      <div class="row">
        <button id="btnLogo">Enviar logo</button>
        <button id="btnLogoTirar" class="ghost">Remover logo</button>
      </div>
      <p class="hint" id="logoMsg"></p>
    </section>
  </div>
</div>

<div class="savebar hidden" id="savebar">
  <div class="in"><div class="msg" id="saveMsg">Tudo salvo</div><button class="primary" id="btnSalvar" disabled>Salvar na TV</button></div>
</div>

<!-- Diálogo genérico -->
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div class="progress" id="prog"><div></div></div>
    <div class="actions"><button value="cancel" class="ghost" id="dlgCancel">Cancelar</button><button value="ok" class="primary" id="dlgOk">Adicionar</button></div>
  </form>
</dialog>
<input type="file" id="file" class="hidden">

<script>
const SUPABASE_URL = "https://ocqgortpqhkgxlxvphkx.supabase.co";
const SUPABASE_KEY = "sb_publishable_q6xrUBBo9rZeoiBmKnHhPQ_RHECq_6z";
const TELA = "principal";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let cfg = null, dirty = false;

// ---------------- Login ----------------
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) start(session); else showLogin();
  sb.auth.onAuthStateChange((_e, s) => { if(s && !cfg) start(s); });
}
function showLogin(){ $("vLogin").classList.remove("hidden"); $("vApp").classList.add("hidden"); $("savebar").classList.add("hidden"); }
$("btnLogin").onclick = async () => {
  const email = $("email").value.trim();
  if(!email) return;
  $("btnLogin").disabled = true;
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + location.pathname } });
  $("btnLogin").disabled = false;
  $("loginMsg").textContent = error ? ("Erro: " + error.message) : "Pronto! Abra seu e-mail e toque no link para entrar.";
};
$("btnSair").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function start(session){
  $("vLogin").classList.add("hidden"); $("vApp").classList.remove("hidden"); $("savebar").classList.remove("hidden");
  $("whoEmail").textContent = session.user.email;
  const { data, error } = await sb.from("telas").select("config").eq("id", TELA).maybeSingle();
  if(error){ $("saveMsg").textContent = "Erro ao carregar: " + error.message; return; }
  cfg = (data && data.config) || { marca:"MAGNUS", itens:[], recados:[], mostrarBarra:true };
  cfg.itens = cfg.itens || []; cfg.recados = cfg.recados || [];
  fillForm(); render(); startLive();
}

// ---------------- Formulário ----------------
function fillForm(){
  $("marca").value = cfg.marca || "";
  $("recados").value = (cfg.recados || []).join("\n");
  $("mostrarBarra").checked = cfg.mostrarBarra !== false;
  $("cidade").value = (cfg.clima && cfg.clima.cidade) || "";
  $("logoMsg").textContent = cfg.logo ? "Logo enviada." : "Sem logo: mostra o nome.";
}
$("marca").oninput = e => { cfg.marca = e.target.value; touch(); };
$("recados").oninput = e => { cfg.recados = e.target.value.split("\n").map(s=>s.trim()).filter(Boolean); touch(); };
$("mostrarBarra").onchange = e => { cfg.mostrarBarra = e.target.checked; touch(); };

$("btnCidade").onclick = async () => {
  const q = $("cidade").value.trim(); if(!q) { cfg.clima = null; touch(); return; }
  $("cidadeMsg").textContent = "Buscando…";
  try{
    const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=pt&name=" + encodeURIComponent(q)).then(r=>r.json());
    const g = r.results && r.results[0];
    if(!g){ $("cidadeMsg").textContent = "Cidade não encontrada."; return; }
    cfg.clima = { cidade: g.name, lat: +g.latitude.toFixed(3), lon: +g.longitude.toFixed(3) };
    $("cidade").value = g.name;
    $("cidadeMsg").textContent = "Encontrada: " + g.name + (g.admin1 ? " – " + g.admin1 : "") + ". Lembre de salvar.";
    touch();
  }catch(e){ $("cidadeMsg").textContent = "Não consegui buscar agora."; }
};

$("btnLogo").onclick = () => pickFile("image/*", async f => {
  $("logoMsg").textContent = "Enviando…";
  try{ cfg.logo = await upload(f); $("logoMsg").textContent = "Logo enviada. Lembre de salvar."; touch(); }
  catch(e){ $("logoMsg").textContent = "Erro: " + e.message; }
});
$("btnLogoTirar").onclick = () => { cfg.logo = ""; fillForm(); touch(); };

// ---------------- Lista ----------------
const ICON = { video:"🎬", instagram:"📷", recado:"💬", imagem:"🖼️" };
const NOME = { video:"Vídeo", instagram:"Instagram", recado:"Recado", imagem:"Imagem" };

function render(){
  const L = $("lista"); L.innerHTML = "";
  if(!cfg.itens.length){ L.innerHTML = '<div class="empty">Nada na TV ainda. Adicione algo abaixo.</div>'; return; }
  cfg.itens.forEach((it, i) => {
    const d = document.createElement("div");
    d.className = "item" + (it.ativo === false ? " off" : "");
    const th = document.createElement("div"); th.className = "thumb";
    if(it.tipo === "video" && it.url){ const v = document.createElement("video"); v.src = it.url + "#t=1"; v.muted = true; v.preload = "metadata"; th.appendChild(v); }
    else if(it.tipo === "imagem" && it.url){ const im = document.createElement("img"); im.src = it.url; th.appendChild(im); }
    else th.textContent = ICON[it.tipo] || "•";
    const b = document.createElement("div"); b.className = "body";
    const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = NOME[it.tipo] || it.tipo;
    const t = document.createElement("div"); t.className = "t";
    const s = document.createElement("div"); s.className = "s";
    if(it.tipo === "instagram"){ t.textContent = it.cliente || "Post de cliente"; s.textContent = it.url; }
    else if(it.tipo === "recado"){ t.textContent = it.titulo || "(sem título)"; s.textContent = it.texto || ""; }
    else { t.textContent = it.nome || it.url.split("/").pop(); s.textContent = it.tipo === "video" ? (it.duracao ? "Corta em " + it.duracao + "s" : "Toca até o fim") + (it.som ? " · com som" : " · sem som") : (it.duracao || 12) + "s na tela"; }
    if(it.tipo !== "video" && it.tipo !== "imagem") s.textContent += (s.textContent ? " · " : "") + (it.duracao || (it.tipo==="instagram"?15:12)) + "s";
    const ctl = document.createElement("div"); ctl.className = "ctl";
    ctl.append(
      btn("↑", () => move(i, -1), i === 0),
      btn("↓", () => move(i, 1), i === cfg.itens.length - 1),
      btn(it.ativo === false ? "Ligar" : "Pausar", () => { it.ativo = it.ativo === false; touch(); render(); }),
      btn("Editar", () => edit(i)),
      btn("Apagar", () => { if(confirmDel(it)){ cfg.itens.splice(i, 1); touch(); render(); } })
    );
    b.append(tag, t, s, ctl);
    d.append(th, b); L.appendChild(d);
  });
}
function btn(txt, fn, dis){ const x = document.createElement("button"); x.className = "small"; x.type = "button"; x.textContent = txt; x.onclick = fn; x.disabled = !!dis; return x; }
function move(i, dir){ const a = cfg.itens; [a[i], a[i+dir]] = [a[i+dir], a[i]]; touch(); render(); }
function confirmDel(it){ return window.confirm("Tirar este item da TV?"); }

// ---------------- Diálogos de adicionar/editar ----------------
function field(id, label, type, value, extra){
  return `<label for="${id}">${label}</label>` + (type === "textarea"
    ? `<textarea id="${id}">${esc(value)}</textarea>`
    : `<input type="${type}" id="${id}" value="${esc(value)}" ${extra||""}>`);
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function openDialog(title, html, okText, onOk){
  $("dlgTitle").textContent = title; $("dlgBody").innerHTML = html; $("dlgOk").textContent = okText;
  $("prog").style.display = "none"; $("dlgOk").disabled = false;
  const d = $("dlg");
  $("dlgForm").onsubmit = async ev => {
    if(ev.submitter && ev.submitter.value === "cancel") return;
    ev.preventDefault();
    $("dlgOk").disabled = true;
    try{ const ok = await onOk(); if(ok === "skip") d.close(); else if(ok !== false){ d.close(); render(); touch(); } }
    catch(e){ alertIn("Erro: " + e.message); }
    $("dlgOk").disabled = false;
  };
  d.showModal();
}
function alertIn(t){ let p = $("dlgBody").querySelector(".hint.err"); if(!p){ p = document.createElement("p"); p.className="hint err"; p.style.color="var(--danger)"; $("dlgBody").appendChild(p);} p.textContent = t; }

$("addVideo").onclick = () => openDialog("Novo vídeo",
  `<label>Arquivo de vídeo (MP4, até 50 MB)</label><input type="file" id="fVid" accept="video/mp4,video/*">
   <p class="hint">Ou cole um link direto de um .mp4:</p>
   ${field("fUrl","Link do vídeo (opcional)","url","")}
   ${field("fDur","Cortar depois de quantos segundos? (0 = toca até o fim)","number",0,'min="0"')}
   <div class="switch"><input type="checkbox" id="fSom"><label for="fSom" style="margin:0;color:var(--ink)">Tocar com som</label></div>`,
  "Adicionar", async () => {
    const f = $("fVid").files[0]; let url = $("fUrl").value.trim(), nome = "";
    if(f){ if(f.size > 50*1024*1024){ alertIn("Vídeo maior que 50 MB. Comprima antes (ex.: HandBrake ou CapCut)."); return false; } url = await upload(f, true); nome = f.name; }
    if(!url){ alertIn("Escolha um arquivo ou cole um link."); return false; }
    cfg.itens.push({ tipo:"video", url, nome, duracao:+$("fDur").value || 0, som:$("fSom").checked });
  });

$("addImagem").onclick = () => openDialog("Nova imagem",
  `<label>Imagem (JPG/PNG, ideal 1920×1080)</label><input type="file" id="fImg" accept="image/*">
   ${field("fDur","Segundos na tela","number",12,'min="3"')}`,
  "Adicionar", async () => {
    const f = $("fImg").files[0]; if(!f){ alertIn("Escolha uma imagem."); return false; }
    const url = await upload(f, true);
    cfg.itens.push({ tipo:"imagem", url, nome:f.name, duracao:+$("fDur").value || 12 });
  });

$("addInsta").onclick = () => openDialog("Post de cliente do Instagram",
  `${field("fUrl","Link do post ou reel","url","",'placeholder="https://www.instagram.com/p/…"')}
   <p class="hint">No Instagram: ••• no post → Copiar link. O post precisa ser de um perfil público.</p>
   ${field("fCli","Nome do cliente","text","")}
   ${field("fLeg","Texto pequeno embaixo (opcional)","text","",'placeholder="@perfildocliente"')}
   ${field("fDur","Segundos na tela","number",15,'min="5"')}`,
  "Adicionar", async () => {
    const url = $("fUrl").value.trim();
    if(!/instagram\.com\/(p|reel|tv)\//.test(url)){ alertIn("Cole o link de um post ou reel (instagram.com/p/… ou /reel/…)."); return false; }
    cfg.itens.push({ tipo:"instagram", url, cliente:$("fCli").value.trim(), legenda:$("fLeg").value.trim(), duracao:+$("fDur").value || 15 });
  });

$("addRecado").onclick = () => openDialog("Recado em tela cheia",
  `${field("fCha","Chamada pequena (opcional)","text","",'placeholder="Promoção da semana"')}
   ${field("fTit","Título","text","")}
   ${field("fTxt","Texto (opcional)","textarea","")}
   ${field("fDur","Segundos na tela","number",12,'min="3"')}`,
  "Adicionar", async () => {
    if(!$("fTit").value.trim()){ alertIn("Escreva um título."); return false; }
    cfg.itens.push({ tipo:"recado", chamada:$("fCha").value.trim(), titulo:$("fTit").value.trim(), texto:$("fTxt").value.trim(), duracao:+$("fDur").value || 12 });
  });

function edit(i){
  const it = cfg.itens[i];
  if(it.tipo === "recado") openDialog("Editar recado",
    field("fCha","Chamada pequena","text",it.chamada) + field("fTit","Título","text",it.titulo) + field("fTxt","Texto","textarea",it.texto) + field("fDur","Segundos na tela","number",it.duracao||12),
    "Salvar", async () => { Object.assign(it, { chamada:$("fCha").value.trim(), titulo:$("fTit").value.trim(), texto:$("fTxt").value.trim(), duracao:+$("fDur").value||12 }); });
  else if(it.tipo === "instagram") openDialog("Editar post",
    field("fUrl","Link","url",it.url) + field("fCli","Nome do cliente","text",it.cliente) + field("fLeg","Texto pequeno","text",it.legenda) + field("fDur","Segundos na tela","number",it.duracao||15),
    "Salvar", async () => { Object.assign(it, { url:$("fUrl").value.trim(), cliente:$("fCli").value.trim(), legenda:$("fLeg").value.trim(), duracao:+$("fDur").value||15 }); });
  else if(it.tipo === "video") openDialog("Editar vídeo",
    field("fDur","Cortar depois de quantos segundos? (0 = até o fim)","number",it.duracao||0) + `<div class="switch"><input type="checkbox" id="fSom" ${it.som?"checked":""}><label for="fSom" style="margin:0;color:var(--ink)">Tocar com som</label></div>`,
    "Salvar", async () => { it.duracao = +$("fDur").value||0; it.som = $("fSom").checked; });
  else openDialog("Editar imagem", field("fDur","Segundos na tela","number",it.duracao||12),
    "Salvar", async () => { it.duracao = +$("fDur").value||12; });
}

// ---------------- Upload ----------------
function pickFile(accept, cb){ const f = $("file"); f.accept = accept; f.value = ""; f.onchange = () => f.files[0] && cb(f.files[0]); f.click(); }
async function upload(file, showProg){
  const ext = (file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path = Date.now() + "-" + Math.random().toString(36).slice(2,8) + "." + ext;
  if(showProg){ $("prog").style.display = "block"; $("prog").firstElementChild.style.width = "35%"; }
  const { error } = await sb.storage.from("midia").upload(path, file, { contentType: file.type || undefined, cacheControl: "31536000" });
  if(showProg) $("prog").firstElementChild.style.width = "100%";
  if(error) throw error;
  return sb.storage.from("midia").getPublicUrl(path).data.publicUrl;
}


// ================= Apresentações =================
// Cada item de "slides" é a URL de uma imagem ou {v: URL do vídeo} (vídeo inserido entre slides)
const isVid = it => it && typeof it === "object" && it.v;
const thumbOf = (d, i) => (d.thumbs && d.thumbs[i]) || (isVid(d.slides[i]) ? (d.slides[i].p || "") : d.slides[i]);
let decks = [], ctl = null;
async function loadDecks(){
  const { data } = await sb.from("apresentacoes").select("id,titulo,slides,thumbs,criado_por,criado_em").order("criado_em", { ascending:false });
  decks = data || []; renderDecks(); renderLive();
}
function renderDecks(){
  const box = $("decks"); box.innerHTML = "";
  if(!decks.length){ box.innerHTML = '<div class="empty">Nenhuma apresentação ainda.</div>'; return; }
  decks.forEach(d => {
    const row = document.createElement("div"); row.className = "deck";
    const im = document.createElement("img"); im.src = thumbOf(d, 0) || ""; row.appendChild(im);
    const b = document.createElement("div"); b.className = "body";
    const t = document.createElement("div"); t.className = "t"; t.style.fontWeight = 600; t.textContent = d.titulo;
    const sm = document.createElement("div"); sm.className = "s"; sm.style.fontSize = "13px"; sm.style.color = "var(--muted)";
    const nv = (d.slides || []).filter(isVid).length;
    sm.textContent = (d.slides || []).length - nv + " slides" + (nv ? " + " + nv + " vídeo" + (nv > 1 ? "s" : "") : "") + " · " + (d.criado_por || "").split("@")[0];
    const c = document.createElement("div"); c.className = "ctl";
    const live = ctl && ctl.modo === "apresentacao" && ctl.apresentacao_id === d.id;
    const go = document.createElement("button"); go.className = "small" + (live ? "" : " primary");
    go.textContent = live ? "● Na TV agora" : "▶ Colocar na TV"; go.disabled = live;
    go.onclick = () => setLive(d.id, 0);
    const del = document.createElement("button"); del.className = "small ghost"; del.textContent = "Apagar";
    del.onclick = async () => { if(!confirm("Apagar \"" + d.titulo + "\"?")) return;
      if(live) await toMural();
      await sb.from("apresentacoes").delete().eq("id", d.id); loadDecks(); };
    const vb = document.createElement("button"); vb.className = "small"; vb.textContent = "＋ Vídeo";
    vb.onclick = () => videoDialog(d);
    c.append(go, vb, del); b.append(t, sm, c); row.appendChild(b); box.appendChild(row);
  });
}
async function setLive(id, slide){
  const { error } = await sb.from("controle").upsert({ tela: TELA, modo: "apresentacao", apresentacao_id: id, slide: slide || 0, pausado: false, atualizado: new Date().toISOString() });
  if(error) alert("Não consegui mandar pra TV: " + error.message); else loadCtl();
}
async function toMural(){
  await sb.from("controle").upsert({ tela: TELA, modo: "mural", apresentacao_id: null, slide: 0, atualizado: new Date().toISOString() });
  loadCtl();
}
async function step(delta){
  if(!ctl || ctl.modo !== "apresentacao") return;
  const d = decks.find(x => x.id === ctl.apresentacao_id); if(!d) return;
  const n = Math.max(0, Math.min(d.slides.length - 1, (ctl.slide || 0) + delta));
  if(n === ctl.slide) return;
  ctl.slide = n; ctl.pausado = false; renderLive();             // resposta imediata
  await sb.from("controle").update({ slide: n, pausado: false, atualizado: new Date().toISOString() }).eq("tela", TELA);
}
async function loadCtl(){
  const { data } = await sb.from("controle").select("*").eq("tela", TELA).maybeSingle();
  ctl = data; renderLive(); renderDecks();
}
function renderLive(){
  const sec = $("secLive");
  const d = ctl && ctl.modo === "apresentacao" && decks.find(x => x.id === ctl.apresentacao_id);
  if(!d){ sec.classList.add("hidden"); return; }
  sec.classList.remove("hidden");
  const n = Math.max(0, Math.min(d.slides.length - 1, ctl.slide || 0));
  const th = d.slides.map((_, i) => thumbOf(d, i));
  const vid = isVid(d.slides[n]);
  $("liveTitle").textContent = d.titulo;
  $("liveNow").src = vid ? th[n] : d.slides[n];
  $("liveNext").src = th[n + 1] || "";
  $("liveNext").style.visibility = th[n + 1] ? "visible" : "hidden";
  $("liveCount").textContent = (vid ? "🎬 Vídeo · " : "") + "Item " + (n + 1) + " de " + d.slides.length;
  $("btnPlay").classList.toggle("hidden", !vid);
  $("btnPlay").textContent = ctl.pausado ? "▶ Continuar vídeo" : "⏸ Pausar vídeo";
  $("btnPrev").disabled = n === 0; $("btnNext").disabled = n >= d.slides.length - 1;
  const st = $("liveStrip");
  if(st.getAttribute("data-id") !== d.id){
    st.setAttribute("data-id", d.id); st.innerHTML = "";
    th.forEach((u, i) => { const im = document.createElement("img"); im.src = u; im.onclick = () => { ctl.slide = i; ctl.pausado = false; renderLive();
      sb.from("controle").update({ slide: i, pausado: false, atualizado: new Date().toISOString() }).eq("tela", TELA); };
      if(isVid(d.slides[i])){ const w = document.createElement("span"); w.className = "vid"; w.appendChild(im); st.appendChild(w); } else st.appendChild(im); });
  }
  [...st.children].forEach((el, i) => (el.tagName === "IMG" ? el : el.firstChild).classList.toggle("cur", i === n));
  const cur = st.children[n]; if(cur) cur.scrollIntoView({ block:"nearest", inline:"center", behavior:"smooth" });
}
$("btnPrev").onclick = () => step(-1);
$("btnNext").onclick = () => step(1);
$("btnMural").onclick = toMural;
$("btnPlay").onclick = async () => {
  if(!ctl) return; ctl.pausado = !ctl.pausado; renderLive();
  await sb.from("controle").update({ pausado: ctl.pausado, atualizado: new Date().toISOString() }).eq("tela", TELA);
};
document.addEventListener("keydown", e => {
  if(e.target.matches && e.target.matches("input,textarea")) return;
  if(e.key === "ArrowRight" || e.key === " ") { step(1); e.preventDefault(); }
  if(e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
});

// Subir PDF: cada página vira uma imagem 1920px (TV) + miniatura
$("btnPdf").onclick = () => pickFile("application/pdf", async f => {
  const msg = $("pdfMsg"), bar = $("pdfProg"), fill = bar.firstElementChild;
  const titulo = prompt("Nome da apresentação:", f.name.replace(/\.pdf$/i, "")) || f.name;
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    bar.style.display = "block"; fill.style.width = "2%"; msg.textContent = "Lendo o PDF…";
    const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
    const id = crypto.randomUUID(), slides = [], thumbs = [];
    for(let i = 1; i <= pdf.numPages; i++){
      msg.textContent = "Preparando slide " + i + " de " + pdf.numPages + "…";
      const page = await pdf.getPage(i);
      const v1 = page.getViewport({ scale: 1 });
      const scale = Math.min(1920 / v1.width, 1080 / v1.height) * 1.0;
      const big = await renderPage(page, scale), small = await renderPage(page, scale * 0.25);
      slides.push(await upBlob(big, `apresentacoes/${id}/${i}.jpg`));
      thumbs.push(await upBlob(small, `apresentacoes/${id}/t${i}.jpg`));
      fill.style.width = Math.round(i / pdf.numPages * 100) + "%";
    }
    const { error } = await sb.from("apresentacoes").insert({ id, titulo, slides, thumbs });
    if(error) throw error;
    msg.textContent = "Pronto! " + pdf.numPages + " slides. Toque em ▶ Colocar na TV.";
    loadDecks();
  }catch(e){ msg.textContent = "Erro: " + (e.message || e); }
  setTimeout(() => { bar.style.display = "none"; }, 1500);
});
// ---- Inserir vídeo entre slides ----
function videoDialog(d){
  const n = (d.slides || []).length;
  let opts = '<option value="0">Antes do 1º item (abre com o vídeo)</option>';
  for(let i = 1; i <= n; i++) opts += `<option value="${i}" ${i === n ? "selected" : ""}>Depois do item ${i}${isVid(d.slides[i-1]) ? " (vídeo)" : ""}</option>`;
  const vids = (d.slides || []).map((it, i) => isVid(it) ? i : -1).filter(i => i >= 0);
  const list = vids.length ? '<div class="vlist"><b style="font-size:13px">Vídeos nesta apresentação</b>' +
    vids.map(i => `<div class="row"><span>🎬 Item ${i + 1}</span><button type="button" class="small ghost" data-rm="${i}">Remover</button></div>`).join("") + "</div>" : "";
  openDialog("Inserir vídeo · " + d.titulo,
    `<label>Vídeo (MP4, até 50 MB)</label><input type="file" id="fVid" accept="video/mp4,video/*">
     <label for="fPos">Onde ele entra</label><select id="fPos">${opts}</select>
     <p class="hint">Na TV o vídeo toca em tela cheia; você avança pelo celular igual a um slide e pode pausar.</p>${list}`,
    "Inserir", async () => {
      const f = $("fVid").files[0]; if(!f){ alertIn("Escolha um vídeo."); return false; }
      if(f.size > 50*1024*1024){ alertIn("Vídeo maior que 50 MB. Comprima antes (HandBrake, CapCut ou exporte em 1080p)."); return false; }
      const pos = +$("fPos").value, stamp = Date.now();
      $("prog").style.display = "block"; $("prog").firstElementChild.style.width = "10%";
      const poster = await videoPoster(f).catch(() => null);
      const ext = (f.name.split(".").pop() || "mp4").toLowerCase().replace(/[^a-z0-9]/g, "") || "mp4";
      const path = `apresentacoes/${d.id}/v${stamp}.${ext}`;
      $("prog").firstElementChild.style.width = "30%";
      const { error } = await sb.storage.from("midia").upload(path, f, { contentType: f.type || "video/mp4", cacheControl: "31536000" });
      if(error) throw error;
      const url = sb.storage.from("midia").getPublicUrl(path).data.publicUrl;
      const purl = poster ? await upBlob(poster, `apresentacoes/${d.id}/v${stamp}.jpg`) : "";
      $("prog").firstElementChild.style.width = "100%";
      const slides = [...d.slides], thumbs = d.slides.map((_, i) => thumbOf(d, i));
      slides.splice(pos, 0, { v: url, p: purl }); thumbs.splice(pos, 0, purl);
      const r = await sb.from("apresentacoes").update({ slides, thumbs }).eq("id", d.id);
      if(r.error) throw r.error;
      await loadDecks(); return "skip";
    });
  $("dlgBody").querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    const i = +b.getAttribute("data-rm");
    const slides = [...d.slides], thumbs = d.slides.map((_, k) => thumbOf(d, k));
    slides.splice(i, 1); thumbs.splice(i, 1);
    const r = await sb.from("apresentacoes").update({ slides, thumbs }).eq("id", d.id);
    if(r.error){ alertIn("Erro: " + r.error.message); return; }
    if(ctl && ctl.apresentacao_id === d.id && ctl.slide >= slides.length)
      await sb.from("controle").update({ slide: Math.max(0, slides.length - 1), atualizado: new Date().toISOString() }).eq("tela", TELA);
    $("dlg").close(); await loadDecks();
  });
}
function videoPoster(file){                      // tira uma "foto" do vídeo para servir de miniatura
  return new Promise((ok, fail) => {
    const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "auto";
    const u = URL.createObjectURL(file); v.src = u;
    const t = setTimeout(() => fail(new Error("timeout")), 15000);
    v.onloadeddata = () => { v.currentTime = Math.min(1, (v.duration || 2) / 2); };
    v.onseeked = () => {
      const w = 480, h = Math.round(w * (v.videoHeight || 270) / (v.videoWidth || 480));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(v, 0, 0, w, h);
      clearTimeout(t); URL.revokeObjectURL(u); c.toBlob(b => b ? ok(b) : fail(new Error("sem imagem")), "image/jpeg", 0.8);
    };
    v.onerror = () => { clearTimeout(t); fail(new Error("vídeo ilegível")); };
  });
}
async function renderPage(page, scale){
  const vp = page.getViewport({ scale });
  const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
}
async function upBlob(blob, path){
  const { error } = await sb.storage.from("midia").upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000", upsert: false });
  if(error) throw error;
  return sb.storage.from("midia").getPublicUrl(path).data.publicUrl;
}
function startLive(){
  loadDecks(); loadCtl();
  sb.channel("painel-ctl").on("postgres_changes", { event: "*", schema: "public", table: "controle", filter: "tela=eq." + TELA },
    p => { if(p.new){ ctl = p.new; renderLive(); renderDecks(); } }).subscribe();
  sb.channel("painel-decks").on("postgres_changes", { event: "*", schema: "public", table: "apresentacoes" }, () => loadDecks()).subscribe();
  setInterval(loadCtl, 8000);
}

// ---------------- Salvar ----------------
function touch(){ dirty = true; $("btnSalvar").disabled = false; $("saveMsg").textContent = "Alterações não salvas"; }
$("btnSalvar").onclick = async () => {
  $("btnSalvar").disabled = true; $("saveMsg").textContent = "Salvando…";
  const { data, error } = await sb.from("telas").update({ config: cfg, atualizado: new Date().toISOString() }).eq("id", TELA).select("id");
  if(error || !data || !data.length){
    $("saveMsg").textContent = error ? "Erro: " + error.message : "Sem permissão para alterar (e-mail não autorizado).";
    $("btnSalvar").disabled = false; return;
  }
  dirty = false; $("saveMsg").textContent = "Salvo! A TV atualiza em até 1 minuto.";
};
window.addEventListener("beforeunload", e => { if(dirty){ e.preventDefault(); e.returnValue = ""; } });

boot();
