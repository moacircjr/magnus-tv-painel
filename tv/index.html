<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Magnus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Linha Magnus: grafite granulado, brilho laranja, condensada em caixa alta + serifa laranja + sans limpa */
:root{
  --bg:#141414; --bg2:#1d1c1b; --fg:#f1ede8; --soft:rgba(241,237,232,.62); --line:rgba(241,237,232,.16);
  --or:#ee5a2c; --or2:#ff7a3d;
  --cond:"Anton","Impact",sans-serif; --serif:"DM Serif Display",Georgia,serif; --sans:"Instrument Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;translate:-50% -50%;transform-origin:center;overflow:hidden;background:radial-gradient(140% 100% at 50% 0%,var(--bg2),var(--bg))}

/* brilhos laranja + granulado */
.blob{position:absolute;border-radius:50%;filter:blur(120px);animation:drift 50s ease-in-out infinite alternate}
.b1{width:820px;height:820px;left:-420px;top:-380px;background:var(--or);opacity:.55}
.b2{width:700px;height:520px;left:-200px;bottom:-380px;background:var(--or2);opacity:.35;animation-duration:62s}
.b3{width:760px;height:620px;right:-260px;bottom:-300px;background:var(--or);opacity:.40;animation-duration:56s}
.b4{width:520px;height:420px;left:820px;top:-360px;background:#ff9a5c;opacity:.18}
@keyframes drift{to{transform:translate(80px,50px) scale(1.1)}}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.20;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.speed{position:absolute;left:0;right:0;top:520px;height:2px;background:linear-gradient(90deg,transparent,rgba(241,237,232,.10) 20%,rgba(238,90,44,.35) 50%,transparent);filter:blur(1px)}

/* vidro líquido escuro */
.glass{position:absolute;border-radius:40px;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 50%,rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(30px) saturate(150%);backdrop-filter:blur(30px) saturate(150%);
  border:1.5px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -20px 40px rgba(238,90,44,.05),0 30px 80px rgba(0,0,0,.45)}
.glass::after{content:"";position:absolute;left:14%;right:14%;bottom:-1.5px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(255,160,110,.9),transparent);pointer-events:none}
.pill{border-radius:999px}

/* marca */
.logo{position:absolute;left:96px;top:70px;font:700 150px/1 var(--sans);letter-spacing:-.06em}
.logo i{color:var(--or);font-style:normal}
.slogan{position:absolute;left:100px;top:252px;font:italic 46px/1 var(--serif);color:var(--soft)}
.slogan b{font-weight:400;color:var(--or)}

/* clima e hora */
.wx{left:56px;top:800px;width:680px;height:108px;display:flex;align-items:center;gap:20px;padding:0 44px}
.wx svg{width:50px;height:50px;flex:none}
.wx .t{font:400 70px/1 var(--cond);letter-spacing:.01em}
.wx .d{margin-left:auto;text-align:right;display:flex;flex-direction:column;white-space:nowrap;font-size:20px;line-height:1.3;color:var(--soft)}
.wx .d b{font:italic 32px/1.1 var(--serif);color:var(--or);font-weight:400}
.hr{left:56px;top:928px;width:680px;height:108px;display:flex;align-items:center;justify-content:space-between;padding:0 44px}
.hr .h{font:400 70px/1 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.hr .dt{text-align:right;font-size:20px;line-height:1.3;color:var(--soft)}
.hr .dt b{display:block;font:italic 32px/1.1 var(--serif);color:var(--or);text-transform:capitalize}

.ico{position:absolute;width:54px;height:54px}
.ig-ico{left:930px;top:80px}
.nw-ico{left:930px;top:604px}
.ico svg{width:100%;height:100%}

/* painéis */
.panel{left:1010px;width:850px;padding:28px;display:flex;gap:32px;align-items:stretch;overflow:hidden}
.ig{top:56px;height:500px}
.nw{top:580px;height:456px}
.media{position:relative;width:390px;height:440px;border-radius:26px;overflow:hidden;flex:none;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(0,0,0,.35));border:1px solid rgba(255,255,255,.10);box-shadow:0 14px 40px rgba(0,0,0,.5)}
.nw .media{width:330px;height:396px;border-radius:22px}
.clip{position:absolute;overflow:hidden;border-radius:18px;transition:opacity .8s}
.clip.off{opacity:0}
.clip iframe{position:absolute;border:0;width:540px;height:960px;transform-origin:0 0;pointer-events:none}
.media img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.05)}
.body{display:flex;flex-direction:column;gap:13px;min-width:0;flex:1;padding:40px 4px 84px 0;justify-content:center;transition:opacity .6s,transform .6s}
.body.out{opacity:0;transform:translateX(14px)}
.k{font:600 17px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--or)}
.n{font:400 44px/0.98 var(--cond);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.leg{font-size:21px;line-height:1.5;color:rgba(241,237,232,.82);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.nw .n{font:400 33px/1.14 var(--serif);text-transform:none;letter-spacing:-.01em;-webkit-line-clamp:5}
.nw .leg{-webkit-line-clamp:3;font-size:20px}
.count{position:absolute;top:26px;right:28px;padding:8px 18px;border-radius:999px;background:rgba(0,0,0,.45);font:500 20px var(--sans);font-variant-numeric:tabular-nums;color:var(--fg)}
.ctl{position:absolute;right:28px;bottom:28px;display:flex;align-items:center;gap:14px}
.ctl span{display:none}
.btn{width:62px;height:62px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.18);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.25),0 10px 24px rgba(0,0,0,.4);transition:transform .15s,background .2s}
.btn:hover{background:var(--or);transform:scale(1.06)} .btn:active{transform:scale(.95)}
.btn:focus-visible{outline:3px solid var(--or);outline-offset:3px}
.btn svg{width:24px;height:24px;stroke:var(--fg)}

.prog{position:absolute;left:28px;bottom:12px;width:390px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.nw .prog{width:330px}
.prog i{display:block;height:100%;width:0;background:var(--or)}
.hidden{display:none!important}

/* modo apresentação (tela cheia, controlado pelo painel/celular) */
#show{position:fixed;inset:0;z-index:50;background:#0b0b0b;opacity:0;pointer-events:none;transition:opacity .6s}
#show.on{opacity:1}
#show .sl{position:absolute;inset:0;background:#0b0b0b center/contain no-repeat;opacity:0;transition:opacity .45s}
#show .sl.on{opacity:1}
#showBar{position:absolute;left:50%;bottom:2.4vh;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:.7vh 1.4vw;border-radius:999px;
  background:rgba(20,20,20,.6);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#f1ede8;font:600 1.6vh var(--sans);opacity:0;transition:opacity .4s}
#showBar.on{opacity:1}
#showBar i{width:8px;height:8px;border-radius:50%;background:var(--or);box-shadow:0 0 0 4px rgba(238,90,44,.3)}
@media (prefers-reduced-motion:reduce){.blob{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="speed"></div><div class="grain"></div>

  <div class="logo">magnus<i>.</i></div>
  <div class="slogan">desperte sua <b>criatividade.</b></div>

  <div class="glass pill wx">
    <svg id="wxIco" viewBox="0 0 64 64" fill="none" stroke="#f1ede8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></svg>
    <span class="t" id="wxT">--°</span>
    <span class="d"><b id="wxC">São Ludgero</b><span id="wxD">Previsão do tempo</span></span>
  </div>
  <div class="glass pill hr">
    <span class="h" id="hora">--:--</span>
    <span class="dt"><b id="dia"></b><span id="data"></span></span>
  </div>

  <div class="ico ig-ico">
    <svg viewBox="0 0 24 24" fill="none" stroke="#f1ede8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.6"/><circle cx="17.6" cy="6.4" r="1.2" fill="#ee5a2c" stroke="#ee5a2c"/>
    </svg>
  </div>
  <div class="ico nw-ico">
    <svg viewBox="0 0 24 24" fill="none" stroke="#f1ede8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9.3"/><path d="M2.9 9.4h18.2M2.9 14.6h18.2" stroke="#ee5a2c"/><path d="M12 2.7c2.6 2.6 3.9 6 3.9 9.3s-1.3 6.7-3.9 9.3c-2.6-2.6-3.9-6-3.9-9.3S9.4 5.3 12 2.7z"/>
    </svg>
  </div>

  <!-- Instagram: último post de cada cliente -->
  <section class="glass panel ig">
    <div class="media"><div class="clip" id="cA"><iframe id="ifA" title="Post do Instagram" scrolling="no"></iframe></div><div class="clip off" id="cB"><iframe id="ifB" title="Post do Instagram" scrolling="no"></iframe></div></div>
    <div class="body" id="igBody">
      <span class="k" id="igK">Instagram</span>
      <span class="n" id="igN">Carregando…</span>
      <div class="leg" id="igL"></div>
    </div>
    <div class="ctl">
      <button class="btn" id="igPrev" aria-label="Cliente anterior"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span></span>
      <button class="btn" id="igNext" aria-label="Próximo cliente"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="prog"><i id="igProg"></i></div>
    <div class="count" id="igPos"></div>
  </section>

  <!-- Notícias -->
  <section class="glass panel nw">
    <div class="media" id="nwMedia"><img id="nwImg" alt=""></div>
    <div class="body" id="nwBody">
      <span class="k" id="nwK">Notícias</span>
      <span class="n" id="nwT">Carregando…</span>
      <div class="leg" id="nwP"></div>
    </div>
    <div class="ctl">
      <button class="btn" id="nwPrev" aria-label="Notícia anterior"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span></span>
      <button class="btn" id="nwNext" aria-label="Próxima notícia"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="prog"><i id="nwProg"></i></div>
    <div class="count" id="nwPos"></div>
  </section>
</div>
<div id="show"><div id="showBar"><i></i><span id="showTitle"></span><span id="showCount"></span></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== Ajustes ===== */
const SUPA="https://ocqgortpqhkgxlxvphkx.supabase.co";
const KEY="sb_publishable_q6xrUBBo9rZeoiBmKnHhPQ_RHECq_6z";
const DUR_POST=30000;      // tempo de cada cliente
const DUR_NOTICIA=40000;   // tempo de cada notícia
const ATUALIZA_MIN=10;     // busca dados novos a cada 10 min
const IG_TOPO=57;          // altura do cabeçalho do embed do Instagram (corta para mostrar só a imagem)
const REELS_LARG=380;      // largura do vídeo dentro do embed de reels (tira as faixas pretas)
const FEED_ALT=540;        // altura da imagem de feed no embed (540 = quadrado, 675 = 4:5)
const CIDADE={lat:-28.33,lon:-49.18,nome:"São Ludgero"};

const $=id=>document.getElementById(id);
const H={apikey:KEY,Authorization:"Bearer "+KEY};
let posts=[],nots=[],pi=0,ni=0,tp=0,tn=0,ativo="A";

function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$("stage").style.transform=`scale(${s})`}
addEventListener("resize",fit);fit();

const embed=l=>{const m=(l||"").match(/instagram\.com\/(p|reel|tv)\/([^/?#]+)/);return m?`https://www.instagram.com/${m[1]==="tv"?"p":m[1]}/${m[2]}/embed/`:null};
const quando=d=>{if(!d)return"";const h=(Date.now()-new Date(d))/36e5;if(h<1)return"agora há pouco";if(h<24)return`há ${Math.round(h)} h`;const x=Math.round(h/24);return x===1?"ontem":`há ${x} dias`};

async function carregar(){
  try{
    const r=await fetch(`${SUPA}/rest/v1/posts_clientes?select=*&order=data.desc,id.desc&limit=300`,{headers:H});
    if(r.ok){const all=await r.json();const vistos=new Set(),ult=[];
      for(const p of all){if(vistos.has(p.cliente))continue;vistos.add(p.cliente);ult.push(p)}   // só o último post de cada cliente
      if(ult.length){const atual=posts[pi]?.cliente;posts=ult;const k=posts.findIndex(p=>p.cliente===atual);pi=k>=0?k:0}}
  }catch(e){}
  try{
    const r=await fetch(`${SUPA}/functions/v1/noticias`);
    if(r.ok){const n=await r.json();if(n.noticias?.length){nots=n.noticias;if(ni>=nots.length)ni=0}}
  }catch(e){}
  clima();
}

/* ===== Previsão do tempo (Open-Meteo, sem chave) ===== */
const ICO={
 sol:'<circle cx="32" cy="32" r="11"/><path d="M32 6v7M32 51v7M6 32h7M51 32h7M13.6 13.6l5 5M45.4 45.4l5 5M13.6 50.4l5-5M45.4 18.6l5-5"/>',
 parcial:'<circle cx="24" cy="22" r="9"/><path d="M24 4v4M8 22H4M12 10l-3-3M36 10l3-3"/><path d="M20 50h28a10 10 0 0 0 0-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-1 17z"/>',
 nuvem:'<path d="M18 48h30a11 11 0 0 0 0-22 15 15 0 0 0-29 3 9.5 9.5 0 0 0-1 19z"/>',
 chuva:'<path d="M18 40h30a11 11 0 0 0 0-22 15 15 0 0 0-29 3 9.5 9.5 0 0 0-1 19z"/><path d="M22 48l-3 8M34 48l-3 8M46 48l-3 8"/>',
 trovao:'<path d="M18 38h30a11 11 0 0 0 0-22 15 15 0 0 0-29 3 9.5 9.5 0 0 0-1 19z"/><path d="M34 40l-6 10h8l-5 10"/>',
 nevoa:'<path d="M10 24h44M6 34h52M12 44h40"/>'
};
function tipo(c){if(c===0)return["sol","Céu limpo"];if(c<=2)return["parcial","Poucas nuvens"];if(c===3)return["nuvem","Nublado"];
  if(c===45||c===48)return["nevoa","Neblina"];if(c>=95)return["trovao","Trovoadas"];if(c>=51)return["chuva",c<=57?"Garoa":"Chuva"];return["nuvem","Nublado"]}
async function clima(){
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CIDADE.lat}&longitude=${CIDADE.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FSao_Paulo&forecast_days=1`);
    const j=await r.json();const[ic,txt]=tipo(j.current.weather_code);
    $("wxIco").innerHTML=ICO[ic];$("wxT").textContent=Math.round(j.current.temperature_2m)+"°";
    $("wxC").textContent=`${CIDADE.nome} · ${txt}`;
    $("wxD").textContent=`Máx ${Math.round(j.daily.temperature_2m_max[0])}° · Mín ${Math.round(j.daily.temperature_2m_min[0])}° · Chuva ${j.daily.precipitation_probability_max[0]??0}%`;
  }catch(e){$("wxIco").innerHTML=ICO.parcial}
}

function encaixa(id,formato){             // recorta só a imagem/vídeo do embed, na proporção certa
  // No embed, o post fica numa caixa de 540px de largura.
  // Feed: caixa 540x540. Reels: caixa 540x675 com o vídeo 9:16 (380px) no meio e faixas pretas nas laterais.
  const W=390,H=440,reels=formato==="REELS";
  const mw=reels?REELS_LARG:540, mh=reels?675:FEED_ALT, x0=(540-mw)/2;
  const s=Math.min(W/mw,H/mh);
  const c=$("c"+id),f=$("if"+id);
  c.style.width=mw*s+"px";c.style.height=mh*s+"px";
  c.style.left=(W-mw*s)/2+"px";c.style.top=(H-mh*s)/2+"px";
  f.style.transform=`scale(${s})`;f.style.left=(-x0*s)+"px";f.style.top=(-IG_TOPO*s)+"px";
}

function mostrarPost(){
  const s=posts[pi];if(!s)return;
  const b=$("igBody");b.classList.add("out");
  const url=embed(s.link),prox=ativo==="A"?"B":"A",fr=$("if"+prox),old=$("if"+ativo);
  if(url&&old.src!==url){encaixa(prox,s.formato);fr.onload=()=>{$("c"+prox).classList.remove("off");$("c"+ativo).classList.add("off");ativo=prox};fr.src=url}
  setTimeout(()=>{
    $("igN").textContent=s.cliente;
    $("igK").textContent=`${s.formato==="REELS"?"Reels":"Post"} · ${quando(s.data)}`;
    $("igL").textContent=(s.texto||"").trim();
    $("igPos").textContent=`${pi+1}/${posts.length}`;
    b.classList.remove("out");
  },400);
  tp=Date.now();
}
function mostrarNoticia(){
  const n=nots[ni];if(!n)return;
  const b=$("nwBody");b.classList.add("out");
  setTimeout(()=>{
    $("nwK").textContent=n.fonte||"Notícias";$("nwT").textContent=n.titulo||"";$("nwP").textContent=n.resumo||"";
    const im=$("nwImg");if(n.imagem){im.src=n.imagem;$("nwMedia").classList.remove("hidden")}else $("nwMedia").classList.add("hidden");
    $("nwPos").textContent=`${ni+1}/${nots.length}`;
    b.classList.remove("out");
  },400);
  tn=Date.now();
}
$("nwImg").onerror=()=>$("nwMedia").classList.add("hidden");

const passaPost=d=>{if(!posts.length)return;pi=(pi+d+posts.length)%posts.length;mostrarPost()};
const passaNot=d=>{if(!nots.length)return;ni=(ni+d+nots.length)%nots.length;mostrarNoticia()};
$("igPrev").onclick=()=>passaPost(-1);$("igNext").onclick=()=>passaPost(1);
$("nwPrev").onclick=()=>passaNot(-1);$("nwNext").onclick=()=>passaNot(1);
// controle remoto / teclado: ← → troca cliente, ↑ ↓ troca notícia, F tela cheia
document.addEventListener("keydown",e=>{
  if(ctl.modo==="apresentacao"&&deck){if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="Enter")passaSlide(1);if(e.key==="ArrowLeft"||e.key==="ArrowUp")passaSlide(-1);return}
  if(e.key==="ArrowRight")passaPost(1);if(e.key==="ArrowLeft")passaPost(-1);
  if(e.key==="ArrowDown")passaNot(1);if(e.key==="ArrowUp")passaNot(-1);
  if(e.key==="f"||e.key==="F")document.documentElement.requestFullscreen?.().catch(()=>{});
});
document.addEventListener("dblclick",()=>document.documentElement.requestFullscreen?.().catch(()=>{}));


/* ===== Modo apresentação ===== */
const TELA="principal";
let ctl={modo:"mural",apresentacao_id:null,slide:0},deck=null,barT=null;
const pre=u=>(u||[]).forEach(x=>{const i=new Image();i.src=x});
function showSlide(){
  const box=$("show");
  if(ctl.modo!=="apresentacao"||!deck?.slides?.length){box.className="";return}
  const n=Math.max(0,Math.min(deck.slides.length-1,ctl.slide||0)),url=deck.slides[n];
  const cur=box.querySelector(".sl.on");
  if(!cur||cur.dataset.u!==url){
    const d=document.createElement("div");d.className="sl";d.dataset.u=url;d.style.backgroundImage=`url("${url}")`;
    box.insertBefore(d,$("showBar"));requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add("on")));
    const olds=[...box.querySelectorAll(".sl")].filter(x=>x!==d);setTimeout(()=>olds.forEach(x=>x.remove()),600);
  }
  pre(deck.slides.slice(n+1,n+3));box.className="on";
  $("showTitle").textContent=deck.titulo||"";$("showCount").textContent=`${n+1} / ${deck.slides.length}`;
  $("showBar").className="on";clearTimeout(barT);barT=setTimeout(()=>$("showBar").className="",3500);
}
async function applyCtl(row){
  if(!row)return;const mudou=row.apresentacao_id!==ctl.apresentacao_id;ctl=row;
  if(ctl.modo==="apresentacao"&&ctl.apresentacao_id&&(mudou||!deck)){
    try{const r=await fetch(`${SUPA}/rest/v1/apresentacoes?id=eq.${ctl.apresentacao_id}&select=id,titulo,slides`,{headers:{apikey:KEY}});
      deck=(await r.json())[0]||null;if(deck)pre(deck.slides.slice(0,3))}catch(e){}
  }
  showSlide();
}
async function loadCtl(){
  try{const r=await fetch(`${SUPA}/rest/v1/controle?tela=eq.${TELA}&select=modo,apresentacao_id,slide,atualizado`,{headers:{apikey:KEY}});
    const row=(await r.json())[0];if(row&&row.atualizado!==ctl.atualizado)applyCtl(row)}catch(e){}
}
function passaSlide(d){
  if(ctl.modo!=="apresentacao"||!deck)return;
  ctl.slide=Math.max(0,Math.min(deck.slides.length-1,(ctl.slide||0)+d));showSlide();
  fetch(`${SUPA}/rest/v1/rpc/mudar_slide`,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({p_tela:TELA,p_delta:d})}).catch(()=>{});
}
try{supabase.createClient(SUPA,KEY).channel("tv-"+TELA)
  .on("postgres_changes",{event:"*",schema:"public",table:"controle",filter:"tela=eq."+TELA},p=>p.new&&applyCtl(p.new)).subscribe()}catch(e){}
setInterval(loadCtl,4000);loadCtl();

function relogio(){const n=new Date(),o={timeZone:"America/Sao_Paulo"};
  $("hora").textContent=n.toLocaleTimeString("pt-BR",{...o,hour:"2-digit",minute:"2-digit"});
  $("dia").textContent=n.toLocaleDateString("pt-BR",{...o,weekday:"long"});
  $("data").textContent=n.toLocaleDateString("pt-BR",{...o,day:"2-digit",month:"long"})+" · Brasília"}

setInterval(()=>{relogio();
  if(posts.length){const f=(Date.now()-tp)/DUR_POST;$("igProg").style.width=Math.min(f,1)*100+"%";if(f>=1)passaPost(1)}
  if(nots.length){const f=(Date.now()-tn)/DUR_NOTICIA;$("nwProg").style.width=Math.min(f,1)*100+"%";if(f>=1)passaNot(1)}
},250);
setInterval(carregar,ATUALIZA_MIN*60000);
setTimeout(()=>location.reload(),6*3600000);
try{navigator.wakeLock?.request("screen").catch(()=>{})}catch(e){}

relogio();
carregar().then(()=>{mostrarPost();mostrarNoticia()});
</script>
